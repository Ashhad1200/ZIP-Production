services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: zip_production
      POSTGRES_USER: zipuser
      POSTGRES_PASSWORD: zippass123
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zipuser -d zip_production"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://zipuser:zippass123@postgres:5432/zip_production
      NODE_ENV: production
      JWT_SECRET: change-me-in-production
      JWT_EXPIRES_IN: "24h"
      PORT: "3001"
      CORS_ORIGIN: http://localhost
      VERIFY_TOKEN_EXPIRY_HOURS: "48"
    ports:
      - "3002:3001"
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "npx prisma db push --schema ./prisma/schema.prisma &&
             node dist/prisma/seed.js &&
             node dist/app.js"

  frontend:
    build: ./frontend
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend

volumes:
  postgres_data:
  uploads_data:
